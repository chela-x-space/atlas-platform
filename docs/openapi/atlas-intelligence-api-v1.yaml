openapi: 3.0.3
info:
  title: ATLAS Intelligence API
  version: 1.0.0
  description: Read-only PUBLIC-STABLE projection over verified ATLAS services. Example values are illustrative only.
servers:
  - url: /
paths:
  /api/v1/status: {get: {summary: Public API status, responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /api/v1/sources: {get: {summary: Source health and attribution, responses: {'200': {$ref: '#/components/responses/Success'}, '503': {$ref: '#/components/responses/Error'}}}}
  /api/v1/events: {get: {summary: Verified events, parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}], responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /api/v1/events/{eventId}: {get: {summary: Verified event detail, parameters: [{$ref: '#/components/parameters/EventId'}], responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}}}}
  /api/v1/timeline: {get: {summary: Global timeline, responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /api/v1/breaking: {get: {summary: Breaking intelligence, responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /api/v1/radar: {get: {summary: AI Radar, responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /api/v1/map: {get: {summary: Coordinate-bearing map events, responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /api/v1/risk: {get: {summary: Deterministic risk projection, responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /api/v1/reports: {get: {summary: Deterministic reports, responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /api/v1/search: {get: {summary: Canonical search, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /api/v1/entities: {get: {summary: Entity projection, parameters: [{$ref: '#/components/parameters/Page'}, {$ref: '#/components/parameters/PageSize'}], responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /api/v1/entities/{entityId}: {get: {summary: Entity detail, parameters: [{$ref: '#/components/parameters/EntityId'}], responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}}}}
  /api/v1/entities/{entityId}/relationships: {get: {summary: Entity relationships, parameters: [{$ref: '#/components/parameters/EntityId'}], responses: {'200': {$ref: '#/components/responses/Success'}}}}
  /api/v1/graph: {get: {summary: Bounded entity graph, responses: {'200': {$ref: '#/components/responses/Success'}}}}
components:
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
    EventId: {name: eventId, in: path, required: true, schema: {type: string}}
    EntityId: {name: entityId, in: path, required: true, schema: {type: string}}
  responses:
    Success:
      description: Successful v1 response
      headers: {X-Request-Id: {schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/SuccessEnvelope'}}}
    Error:
      description: Standard v1 error
      headers: {X-Request-Id: {schema: {type: string}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}
  schemas:
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: {description: Public resource representation}
        meta: {$ref: '#/components/schemas/Meta'}
    Meta:
      type: object
      required: [apiVersion, requestId, generatedAt, degraded]
      properties:
        apiVersion: {type: string, example: v1}
        requestId: {type: string, example: v1_example_request}
        generatedAt: {type: string, format: date-time}
        degraded: {type: boolean}
        freshness: {type: object, additionalProperties: true}
        pagination: {type: object, additionalProperties: true}
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, status, retryable]
          properties:
            code: {type: string}
            message: {type: string}
            requestId: {type: string}
            status: {type: integer}
            retryable: {type: boolean}
            details: {type: object, additionalProperties: true}
